<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Demo webpage for testing GitHub build and deploy">
    <title>Demo Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 3rem;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            text-align: center;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 1rem;
            font-size: 2.5rem;
        }
        
        p {
            margin-bottom: 1rem;
            color: #666;
            font-size: 1.1rem;
        }
        
        .badge {
            display: inline-block;
            background: #4CAF50;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            margin-top: 1rem;
            font-weight: bold;
        }
        
        .info {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid #f0f0f0;
        }
        
        .info-item {
            margin: 0.5rem 0;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Demo Page</h1>
        <p>Welcome to the demo webpage!</p>
        <p>This page is designed for testing GitHub build and deploy workflows.</p>
        <div class="badge">✓ Deployed Successfully</div>
        
        <div class="info">
            <div class="info-item">Repository: demo-webpage</div>
            <div class="info-item">Build Status: Active</div>
            <div class="info-item">Version: 1.0.0</div>
        </div>
    </div>
    
    <script>
        console.log('Demo page loaded successfully at:', new Date().toISOString());
    </script>
</body>
</html>
